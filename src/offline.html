<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ee5a48">
<title>Geen verbinding — Leeropslag</title>
<style>
    html, body { height: 100%; }
    body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1d1a16;
        background-image: radial-gradient(120% 90% at 50% 0%, #2b251c 0%, #1d1a16 60%);
        color: #f4efe3;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-align: center;
    }
    .kaart { max-width: 320px; padding: 24px; }
    .hart {
        width: 64px; height: 64px;
        margin: 0 auto 16px;
        display: block;
        filter: drop-shadow(0 14px 26px rgba(238, 90, 72, .4));
    }
    h1 { font-size: 20px; margin: 0 0 8px; font-weight: 600; }
    p { color: #c9bda4; margin: 0 0 20px; line-height: 1.5; }
    .titelklein { display: block; margin-bottom: 10px; font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: #ee5a48; }
    button {
        border: 0;
        background: #ee5a48;
        color: #fff;
        font: inherit;
        font-weight: 600;
        padding: 13px 22px;
        border-radius: 12px;
        cursor: pointer;
        min-height: 48px;
    }
    button:active { background: #d84a38; }
</style>
</head>
<body>
    <div class="kaart">
        <span class="titelklein">RE-&#10084; LEATHER</span>
        <svg class="hart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#ee5a48"/></svg>
        <h1>Geen verbinding</h1>
        <p>De Leeropslag-app kan nu niet bij de server komen. Controleer je
        internetverbinding en probeer het opnieuw.</p>
        <button onclick="location.reload()">Opnieuw proberen</button>
    </div>
</body>
</html>
